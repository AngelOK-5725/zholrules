name: Keep Alive

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          echo "Pinging https://zholrules.onrender.com/api/health"
          curl -s https://zholrules.onrender.com/api/health
          echo ""
          echo "Done at $(date)"
